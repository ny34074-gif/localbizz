<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - LocalBiz</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<nav class="navbar">

    <div class="container nav-inner">

        <a
            class="logo"
            href="index.html"
        >

            <span class="logo-mark">
                L
            </span>

            LocalBiz

        </a>


        <div class="nav-actions">

            <a
                class="btn btn-outline"
                href="index.html"
            >
                ← Home
            </a>

            <a
                class="btn btn-primary"
                href="register.html"
            >
                Register
            </a>

        </div>

    </div>

</nav>


<main class="auth-wrap">

    <div class="auth-card">

        <h1>
            Welcome Back
        </h1>

        <p>
            Login as a customer or business owner.
        </p>


        <form id="loginForm">


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    name="email"
                    class="input"
                    type="email"
                    autocomplete="email"
                    required
                    placeholder="you@example.com"
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    name="password"
                    class="input"
                    type="password"
                    autocomplete="current-password"
                    required
                    placeholder="••••••••"
                >


                <div
                    style="
                        margin-top:8px;
                        text-align:right;
                    "
                >

                    <a
                        href="forgot-password.html"
                        style="
                            color:var(--primary);
                            font-weight:700;
                            font-size:14px;
                        "
                    >
                        Forgot Password?
                    </a>

                </div>

            </div>


            <div style="
                margin-bottom:20px;
            ">

                <label style="
                    display:flex;
                    align-items:center;
                    gap:8px;
                ">

                    <input
                        type="checkbox"
                        name="remember"
                    >

                    Remember me

                </label>

            </div>


            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%"
            >
                Login
            </button>

        </form>


        <p style="
            margin-top:20px;
            text-align:center;
        ">

            Don't have an account?

            <a
                href="register.html"
                style="
                    color:var(--primary);
                    font-weight:700;
                "
            >
                Create one
            </a>

        </p>


        <div style="
            border-top:1px solid var(--border);
            margin-top:25px;
            padding-top:20px;
            text-align:center;
        ">

            <a
                href="admin-login.html"
                style="
                    color:var(--muted);
                    font-weight:700;
                    font-size:14px;
                "
            >
                🔐 Administrator Login
            </a>

        </div>

    </div>

</main>


<script src="js/main.js"></script>

<script src="js/auth.js"></script>

</body>

</html>
