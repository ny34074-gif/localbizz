<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - LocalBiz</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="container nav-inner">

        <a class="logo" href="index.html">

            <span class="logo-mark">
                L
            </span>

            LocalBiz

        </a>

        <a
            class="btn btn-outline"
            href="index.html"
        >
            ← Home
        </a>

    </div>

</nav>


<main class="auth-wrap">

    <div class="auth-card">

        <h1>
            Create Account
        </h1>

        <p>
            Verify your email to create your account.
        </p>


        <!-- ======================
             REGISTER FORM
        ======================= -->

        <form id="registerForm">


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        name="name"
                        class="input"
                        required
                        placeholder="Your name"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Phone
                    </label>

                    <input
                        name="phone"
                        class="input"
                        placeholder="+91"
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    name="email"
                    class="input"
                    type="email"
                    required
                    placeholder="you@example.com"
                >

            </div>


            <div class="form-group">

                <label>
                    Account Type
                </label>

                <select
                    name="role"
                    class="select"
                >

                    <option value="user">
                        Customer
                    </option>

                    <option value="business_owner">
                        Business Owner
                    </option>

                </select>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        name="password"
                        class="input"
                        type="password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        name="confirmPassword"
                        class="input"
                        type="password"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%"
            >
                Send Verification OTP
            </button>

        </form>


        <!-- ======================
             OTP FORM
        ======================= -->

        <form
            id="otpForm"
            class="hidden"
            style="margin-top:20px"
        >

            <div class="notice">

                We sent a 6-digit OTP
                to your email.

            </div>


            <div class="form-group">

                <label>
                    Verification OTP
                </label>

                <input
                    id="registrationOtp"
                    class="input"
                    type="text"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="Enter 6-digit OTP"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%"
            >
                Verify Email & Create Account
            </button>


            <button
                type="button"
                id="changeEmailBtn"
                class="btn btn-outline"
                style="
                    width:100%;
                    margin-top:10px;
                "
            >
                Change Email
            </button>

        </form>


        <p style="margin-top:20px">

            Already have an account?

            <a
                href="login.html"
                style="
                    color:var(--primary);
                    font-weight:700;
                "
            >
                Login
            </a>

        </p>

    </div>

</main>


<script src="js/main.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
