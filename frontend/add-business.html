<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Add Business - LocalBiz</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar"><div class="container nav-inner"><a class="logo" href="index.html"><span class="logo-mark">L</span>LocalBiz</a><a class="btn btn-outline" href="owner-dashboard.html">← Dashboard</a></div></nav>
<section class="section"><div class="container" style="max-width:900px"><div class="section-head"><div><h2>Add Your Business</h2><p>Provide complete information to submit your listing for approval.</p></div></div><div class="details-card"><form id="businessForm" enctype="multipart/form-data"><div class="form-row"><div class="form-group"><label>Business Name</label><input name="business_name" class="input" required placeholder="e.g. The Urban Table"></div><div class="form-group"><label>Category</label><select name="category_id" id="businessCategory" class="select" required><option value="">Select category</option><option value="1">Restaurants</option><option value="2">Hospitals</option><option value="3">Grocery Stores</option><option value="4">Salons</option><option value="5">Hotels</option><option value="6">Medical Shops</option><option value="7">Electronics</option></select></div></div><div class="form-group"><label>Description</label><textarea name="description" class="textarea" required placeholder="Tell customers about your business..."></textarea></div><div class="form-group"><label>Address</label><input name="address" class="input" required placeholder="Complete business address"></div><div class="form-row"><div class="form-group"><label>Phone</label><input name="phone" class="input" required></div><div class="form-group"><label>Email</label><input name="email" class="input" type="email"></div></div><div class="form-row"><div class="form-group"><label>Opening Time</label><input name="opening_time" class="input" type="time"></div><div class="form-group"><label>Closing Time</label><input name="closing_time" class="input" type="time"></div></div><div class="form-group"><label>Available Services</label><input name="services" class="input" placeholder="Dine-in, Takeaway, Delivery"></div><div class="form-group"><label>Business Images</label><input name="images" class="input" type="file" multiple accept="image/*"></div><button class="btn btn-primary">Submit for Approval</button></form></div></div></section><script src="js/main.js"></script><script src="js/app-pages.js"></script></body></html>
