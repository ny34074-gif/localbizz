<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - LocalBiz</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<nav class="navbar">

    <div class="container nav-inner">

        <a
            class="logo"
            href="index.html"
        >

            <span class="logo-mark">
                L
            </span>

            LocalBiz

        </a>

        <a
            class="btn btn-outline"
            href="login.html"
        >
            ← Login
        </a>

    </div>

</nav>


<main class="auth-wrap">

    <div class="auth-card">

        <h1>
            Forgot Password?
        </h1>

        <p>
            Enter your email to receive a reset OTP.
        </p>


        <form id="forgotForm">

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    name="email"
                    class="input"
                    type="email"
                    required
                    placeholder="you@example.com"
                >

            </div>


            <button
                class="btn btn-primary"
                style="width:100%"
            >
                Send OTP
            </button>

        </form>


        <form
            id="resetForm"
            class="hidden"
            style="margin-top:22px"
        >

            <div class="form-group">

                <label>
                    OTP
                </label>

                <input
                    name="otp"
                    class="input"
                    maxlength="6"
                    required
                    placeholder="6-digit OTP"
                >

            </div>


            <div class="form-group">

                <label>
                    New Password
                </label>

                <input
                    name="new_password"
                    class="input"
                    type="password"
                    minlength="6"
                    required
                    placeholder="New password"
                >

            </div>


            <div class="form-group">

                <label>
                    Confirm New Password
                </label>

                <input
                    name="confirm_password"
                    class="input"
                    type="password"
                    minlength="6"
                    required
                    placeholder="Confirm password"
                >

            </div>


            <button
                class="btn btn-primary"
                style="width:100%"
            >
                Reset Password
            </button>

        </form>


        <p style="margin-top:20px">

            Remember your password?

            <a
                href="login.html"
                style="
                    color:var(--primary);
                    font-weight:700;
                "
            >
                Login
            </a>

        </p>

    </div>

</main>


<script src="js/main.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
